spring:
  application:
    name: haierag-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:haierag}
    username: ${POSTGRES_USER:haierag}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      maximum-pool-size: 15
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
  servlet:
    multipart:
      enabled: true
      # Hard limits; the service additionally enforces MAX_UPLOAD_SIZE_MB with a 413 problem response.
      max-file-size: ${MAX_UPLOAD_SIZE_MB:50}MB
      max-request-size: ${MAX_UPLOAD_SIZE_MB:50}MB
      file-size-threshold: 1MB
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: native
  # Never compress: chat answers are streamed as text/event-stream and must not be buffered.
  compression:
    enabled: false
  tomcat:
    max-swallow-size: -1

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN

haierag:
  env: ${APP_ENV:development}
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-jwt-secret-change-me-0123456789}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:14}
  bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  max-upload-size-mb: ${MAX_UPLOAD_SIZE_MB:50}
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${STORAGE_ACCESS_KEY:haierag}
    secret-key: ${STORAGE_SECRET_KEY:}
    bucket: ${STORAGE_BUCKET:haierag-documents}
    region: ${STORAGE_REGION:us-east-1}
  ai:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    internal-token: ${INTERNAL_API_TOKEN:}
    connect-timeout: 5s
    health-timeout: 3s
    chat-timeout: 10m
    history-messages: 6
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:20}
    chat-per-minute: ${RATE_LIMIT_CHAT_PER_MINUTE:20}
