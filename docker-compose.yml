# HaieRag — local deployment.
# Ollama runs natively on macOS (Apple Silicon acceleration); containers reach it via host.docker.internal.
# Only the frontend (3000) and backend (8080) are published, and only on 127.0.0.1.
name: haierag

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-haierag}
      POSTGRES_USER: ${POSTGRES_USER:-haierag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/00-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  # S3-compatible object storage (RustFS; MinIO no longer publishes community images).
  storage:
    image: rustfs/rustfs:1.0.6
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-haierag}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY in .env}
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes:
      - storagedata:/data
    healthcheck:
      test: ["CMD-SHELL", "busybox nc -z 127.0.0.1 9000 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      STORAGE_ENDPOINT: http://storage:9000
      AI_SERVICE_URL: http://ai-service:8000
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      storage: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      STORAGE_ENDPOINT: http://storage:9000
      OLLAMA_BASE_URL: ${OLLAMA_DOCKER_BASE_URL:-http://host.docker.internal:11434}
      HF_HOME: /models/hf
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - hfcache:/models/hf
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      storage: { condition: service_healthy }
      backend: { condition: service_healthy }   # the schema is migrated by the backend (Flyway)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  storagedata:
  hfcache:
